name: Autenticación
description: |-

  Endpoints para login, refresh de token, logout y perfil del usuario autenticado.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/login
    metadata:
      custom: []
      groupName: Autenticación
      groupDescription: |-

        Endpoints para login, refresh de token, logout y perfil del usuario autenticado.
      subgroup: ''
      subgroupDescription: ''
      title: Login
      description: 'Autentica al usuario y retorna un JWT de acceso y un token de refresco.'
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: validation.email.
        required: true
        example: gbailey@example.net
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: validation.min.
        required: true
        example: '+-0pBNvYgxwmi/#iw'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: gbailey@example.net
      password: '+-0pBNvYgxwmi/#iw'
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "success": true,
            "message": "Login exitoso",
            "data": {
              "access_token": "eyJ...",
              "refresh_token": "eyJ...",
              "token_type": "bearer",
              "expires_in": 3600
            }
          }
        headers: []
        description: ''
      -
        custom: []
        status: 401
        content: '{"success":false,"message":"Credenciales incorrectas"}'
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
